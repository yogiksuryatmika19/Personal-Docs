site_name: Yogi Suryatmika
site_url: https://mydomain.org/mysite

theme:
    name: material
    palette:
        # Light mode
        - scheme: default
          primary: black
          accent: black
          toggle:
              icon: material/weather-night
              name: Switch to dark mode
        # Dark mode
        - scheme: slate
          primary: black
          accent: black
          toggle:
              icon: material/weather-sunny
              name: Switch to light mode

    features:
        - navigation.tabs
        - navigation.tabs.sticky
        - navigation.tracking
        - navigation.sections
        - toc.follow
        - content.code.copy

markdown_extensions:
    - pymdownx.highlight:
          anchor_linenums: true
          line_spans: __span
          pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.superfences
    - toc:
          permalink: true

plugins:
    - search
    - awesome-pages

extra_css:
    - stylesheets/extra.css
