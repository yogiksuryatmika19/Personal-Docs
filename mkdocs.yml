site_name: Yogi Suryatmika
site_url: https://mydomain.org/mysite

theme:
    name: material
    palette:
        - scheme: slate
          primary: black
          accent: cyan

    features:
        - navigation.tabs
        - navigation.tabs.sticky
        - navigation.tracking
        - navigation.sections
        - toc.follow
        - content.code.copy

markdown_extensions:
    - pymdownx.highlight:
          anchor_linenums: true
          line_spans: __span
          pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.superfences
    - toc:
          permalink: true

plugins:
    - search
    - awesome-pages
